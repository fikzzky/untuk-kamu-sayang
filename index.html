<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blue Night Letter V6</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Background -->

<div id="sky"></div>

<div id="stars"></div>

<div id="clouds"></div>

<div id="meteors"></div>

<div id="particles"></div>

<div id="moon"></div>

<!-- Halaman Awal -->

<div id="home">

<div id="envelope">

<div class="title">

<h1>Untuk Fanny</h1>

<p>Ada sesuatu yang ingin kusampaikan malam ini...</p>

</div>

<button id="openBtn">

💌 Buka Surat

</button>

</div>

</div>

<!-- Surat -->

<div id="letterPage">

<div class="paper">

<h2>Untuk Fanny</h2>

<p class="sub">

A Letter Under The Blue Night Sky

</p>

<div id="typing"></div>

<div class="signature">

— Fikri

</div>

<button id="closeBtn">

Tutup Surat

</button>

</div>

</div>

<audio id="bgMusic" loop>

<source src="music/night.mp3" type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
